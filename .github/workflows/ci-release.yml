name: Native macOS build and signed release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate Go build cache
        id: go-cache-info
        run: |
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-cache-info.outputs.path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-info.outputs.version }}-${{ hashFiles('go.mod', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-info.outputs.version }}-
      - name: Unit tests and packaging checks
        run: |
          go test -race ./...
          go vet ./...
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Save Go build cache from successful main push
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-cache-info.outputs.path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  native:
    needs: unit
    # These are standard runners, free for public repos. Intentionally no
    # -large/-xlarge labels and no Rosetta/cross-compiled release artifacts.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            source: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - name: Identify compiler caches and actual Apple build environment
        id: cache-info
        run: |
          set -euo pipefail
          echo "go-path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          {
            sw_vers -productVersion
            xcodebuild -version
            xcrun --show-sdk-version
            xcrun clang --version
            rustc --version --verbose
          } | tee "$RUNNER_TEMP/rust-build-environment.txt"
          echo "apple-toolchain=$(shasum -a 256 "$RUNNER_TEMP/rust-build-environment.txt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-info.outputs.go-path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.go-version }}-${{ hashFiles('go.mod', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-info.outputs.go-version }}-
      - name: Restore pinned Rust dependencies and native target
        id: rust-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            .build/upstream-arm64/target
          # upstream.json binds the exact Cargo.lock through its pinned upstream
          # commit, plus submodules, Rust toolchain and minimum macOS. No broad
          # fallback is allowed across source/compiler/SDK/build-setting changes.
          key: rust-build-v1-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-${{ hashFiles('upstream.json', 'scripts/build-native.sh', '.github/workflows/ci-release.yml') }}-${{ steps.cache-info.outputs.apple-toolchain }}
      - name: Report cache restore decisions
        env:
          GO_HIT: ${{ steps.go-cache.outputs.cache-hit }}
          GO_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          RUST_KEY: ${{ steps.rust-cache.outputs.cache-matched-key }}
        run: |
          printf 'Go cache exact hit: %s; restored key: %s\n' "${GO_HIT:-false}" "${GO_KEY:-none}"
          printf 'Rust cache exact hit: %s; restored key: %s\n' "${RUST_HIT:-false}" "${RUST_KEY:-none}"
      - name: Native build, architecture/dependency audit, isolated launchd smoke
        env:
          PACKAGE_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          scripts/build-native.sh "$version" '${{ matrix.arch }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save Rust cache after successful main build and packaging
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            .build/upstream-arm64/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save Go build cache after successful main native job
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-info.outputs.go-path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  release:
    needs: native
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate Go build cache
        id: go-cache-info
        run: |
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore main Go build cache without saving release state
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-cache-info.outputs.path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-info.outputs.version }}-${{ hashFiles('go.mod', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-info.outputs.version }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Prepare exact release metadata
        run: |
          go run ./cmd/release-tool manifest "${GITHUB_REF_NAME#v}"
          go run ./cmd/release-tool checksums
      - name: Attest the final binaries, SBOMs, metadata, and complete source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create or resume an unpublished release and upload final assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' >/tmp/release-is-draft 2>/dev/null; then
            # Do not silently replace an already-published release on rerun.
            test "$(cat /tmp/release-is-draft)" = true || { echo 'Release already published; create a new version' >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-inputs
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  packslip:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Deliberately no checkout and no release-write permission in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-inputs
          path: dist
      - name: Sign and verify the Packslip manifest with this workflow identity
        id: packslip
        uses: jdx/packslip@87479dfc6443253dff69601cace5fc6ea07e6df5 # v1 / CLI 1.4.0
        with:
          artifacts: dist/*-darwin-*.tar.gz dist/*-darwin-*.cdx.json
          manifest: dist/packslip.toml
          attest: link
          upload: false
      - name: Check every signed installable artifact and SBOM
        env:
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: |
          set -euo pipefail
          args=()
          for file in dist/*-darwin-*.tar.gz dist/*-darwin-*.cdx.json; do
            args+=(--artifact "$file")
          done
          packslip verify "$BUNDLE" \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/" \
            --issuer https://token.actions.githubusercontent.com "${args[@]}"
          packslip show "$BUNDLE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: packslip
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packslip-bundle
          path: packslip
      - name: Publish only after the signed manifest passed verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  verify-published-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.18'
          install: false
          cache: false
      - name: Install through Packslip from the public release and inspect all binaries
        env:
          # Only this fresh-release smoke bypasses the ordinary 24h age delay;
          # all signature, identity, digest and platform checks stay enabled.
          MISE_MINIMUM_RELEASE_AGE: 0s
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="packslip:github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME#v}"
          mise install "$tool"
          mise exec "$tool" -- rustdesk-server --version
          mise exec "$tool" -- hbbs --help
          mise exec "$tool" -- hbbr --help
          install_dir="$(mise where "$tool")"
          for name in rustdesk-server hbbs hbbr; do
            test "$(lipo -archs "$install_dir/bin/$name")" = "$(uname -m)"
            codesign --verify --strict "$install_dir/bin/$name"
          done
